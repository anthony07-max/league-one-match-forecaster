name: Weekly League One update
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC, after the weekend's fixtures
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: bash run_pipeline.sh
      - run: pytest -q
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed charts
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push
